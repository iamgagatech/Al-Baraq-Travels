            }
          },

            "@type": "Question",
            "name": "How do I get a price for a trip?",
            "acceptedAnswer": {

            }
          },
          {
            "@type": "Question",
            "name": "Can I contact you on WhatsApp?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The listed number is WhatsApp-enabled — message +234 802 402 9843 or use any of the WhatsApp buttons on this page. You can also call the same number."

          },

            "@type": "Question",
            "name": "Where is the office?",
